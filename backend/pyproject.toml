[project]
name = "fromo-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "certifi>=2026.5.20",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "httpx2>=2.4.0",
    "psycopg2-binary>=2.9.12",
    "pyjwt[cryptography]>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
