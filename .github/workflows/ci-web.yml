# Installs dependencies with npm ci and builds the Vite app.

name: Web CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"                               # Trigger when web code changes
      - ".github/workflows/ci-web.yml"         # Also trigger when this workflow file itself changes
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  build:
    runs-on: ubuntu-latest  # Linux VM — fast and free on GitHub Actions

    steps:
      - uses: actions/checkout@v4   # Clone the repository into the virtual machine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"                           # Node 20 is the current LTS version
          cache: "npm"                                 # Cache npm packages between runs
          cache-dependency-path: web/package-lock.json # Invalidate cache when package-lock.json changes

      - name: Install dependencies
        working-directory: web
        # npm ci reads package-lock.json exactly — faster than npm install and
        # fails automatically if package-lock.json is out of sync with package.json
        run: npm ci

      # TODO: Re-enable once the Vitest suite is updated for the current UI.
      # - name: Run tests
      #   working-directory: web
      #   run: npm test

      # - name: Lint with ESLint
      #   working-directory: web
      #   run: npm run lint

      - name: Build app
        working-directory: web
        # Runs vite build — verifies the app compiles without errors
        run: npm run build
