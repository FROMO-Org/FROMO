# Runs data/predictions.py once a day to forecast tomorrow's busyness and
# write it to Supabase.
#
# Schedule note: 09:00 UTC lands at ~04:00-05:00 America/New_York depending on
# DST. That's well after NY midnight (so "tomorrow" is unambiguous) and far
# enough from the midnight boundary that cron's fixed-UTC firing time never
# risks crossing into the wrong NY calendar day as DST shifts through the
# year.

name: Daily Busyness Predictions

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Run daily prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python data/predictions.py
