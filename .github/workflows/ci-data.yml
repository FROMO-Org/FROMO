# Installs Python deps and runs the predictions.py smoke tests — validates the
# committed ML artifacts (model.txt, norm_table.csv, feature_cols.json) and
# the predict -> apply_norm -> compute_level path against a small in-memory
# fixture. Does NOT run the real daily pipeline (no weather fetch, no
# Supabase write) — that happens on the scheduled daily-predictions.yml job.

name: Data & ML CI

on:
  push:
    branches: ["main"]
    paths:
      - "data/**"                          # Trigger when data/ML code or artifacts change
      - ".github/workflows/ci-data.yml"    # Also trigger when this workflow file itself changes
  pull_request:
    branches: ["main"]
    paths:
      - "data/**"
      - ".github/workflows/ci-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4   # Clone the repository into the virtual machine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data/requirements.txt

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Run smoke tests
        # Validates model.txt/norm_table.csv/feature_cols.json load correctly,
        # then runs predict() -> apply_norm() -> compute_level() against a
        # small fixture and checks the output schema and value ranges.
        run: python -m pytest data/tests/ -v
