name: Mobile CI

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"                            # Trigger when mobile code changes
      - ".github/workflows/ci-mobile.yml"      # Also trigger when this workflow file itself changes
  pull_request:
    branches: ["main"]     # Always run on PRs targeting main

jobs:
  test:
    runs-on: ubuntu-latest  # Linux VM is sufficient for Flutter analyze and tests

    steps:
      - uses: actions/checkout@v4   # Clone the repository into the virtual machine

      - name: Set up Flutter
        uses: subosito/flutter-action@v2  # Official Flutter GitHub Action
        with:
          flutter-version: "3.x"   # Use the latest stable Flutter 3.x (matches pubspec.yaml sdk: ^3.12.1)
          channel: stable
          cache: true               # Cache Flutter SDK and pub packages — most impactful here as Flutter SDK is large (~500MB)

      - name: Install dependencies (enforce lockfile)
        working-directory: mobile
        # --enforce-lockfile installs packages AND fails if pubspec.lock is out of sync with pubspec.yaml
        # Catches cases where someone added a dependency but forgot to run flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Lint with flutter analyze
        working-directory: mobile
        # Uses flutter_lints (configured in analysis_options.yaml) to check for code issues
        run: flutter analyze

      - name: Run tests
        working-directory: mobile
        run: flutter test   # Runs all tests under the test/ directory
