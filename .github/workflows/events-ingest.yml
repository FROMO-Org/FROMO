# Daily scheduled job: fetches tomorrow's Manhattan events from Ticketmaster,
# upserts venues/events into Supabase, and generates an AI summary per event
# via Gemini. Runs at 06:00 UTC (02:00 NYC) — before the "tomorrow" (NY
# calendar day) events it fetches begin.

name: Ticketmaster Events Ingest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data/events/requirements.txt

      - name: Install dependencies
        run: pip install -r data/events/requirements.txt

      - name: Run ingestion
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python data/events/ticketmaster_ingest.py
